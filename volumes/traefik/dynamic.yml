---
# This configuration is inspired by:
#   - https://github.com/Quiq/webauthn_proxy/tree/main?tab=readme-ov-file#nginx
#   - https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview/#forwardauth-with-401-errors-middleware

http:
  routers:
    webauthn-proxy:
      rule: PathPrefix(`/webauthn/`)
      service: webauthn-proxy
    myservice:
      rule: "!PathPrefix(`/webauthn/`)"
      middlewares: [auth-errors, auth-forward]
      service: myservice

  middlewares:
    auth-forward:
      forwardAuth:
        address: http://webauthn-proxy:8080/webauthn/auth
        authResponseHeaders: [X-Authenticated-User]
        # Set this to true only if this Traefik instance is running behind
        # another reverse proxy. See
        # https://community.traefik.io/t/what-does-trustforwardheader-do-for-forwardauth-and-when-would-we-use-it/14429
        # Warning: this option is deprecated, but Traefik currently requires to
        # set it explicitly. For more information see
        # https://doc.traefik.io/traefik/migrate/v3/#forwardauth-middleware-trustforwardheader
        trustForwardHeader: true
        # It is strongly recommended to set this option to a suitable value. See
        # https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/forwardauth/#maxresponsebodysize
        maxResponseBodySize: 2097152 # 2 MB
    auth-errors:
      errors:
        status: ["401"]
        service: webauthn-proxy
        # We use a custom HTML page to do the redirect because the "errors"
        # middleware preserves the status code of the original response (in
        # this case 401)
        query: /webauthn/static/redirect-login.html

  services:
    webauthn-proxy:
      loadBalancer:
        servers:
          - url: http://webauthn-proxy:8080/
    myservice:
      loadBalancer:
        servers:
          - url: http://whoami/
          # - url: http://webserver/
